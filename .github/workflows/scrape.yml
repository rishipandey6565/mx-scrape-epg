name: Daily Schedule Scraper

on:
  schedule:
    # 5:50 AM Mexico City Time (UTC-6) -> 11:50 UTC
    - cron: '50 11 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Run Scraper Script
        env:
          SCRAPE_WORKERS: 20
        run: python scraper.py
        
      - name: Run Image Downloader Script
        env:
          IMAGE_WORKERS: 50
        run: python image_downloader.py
        
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -d "schedule" ]; then git add schedule/; fi
          if [ -d "downloaded-images" ]; then git add downloaded-images/; fi
          if [ -f "scrape.log" ]; then git add scrape.log; fi
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update schedules and images [skip ci]"
            git push
          fi

      - name: Compress Data
        run: |
          # Use -C to enter the directory before compressing so parent folders aren't included
          if [ -d "schedule" ]; then tar -czf schedule.tar.gz -C schedule .; fi
          if [ -d "downloaded-images" ]; then tar -czf images.tar.gz -C downloaded-images .; fi

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload Archives to VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          if [ -f "schedule.tar.gz" ]; then
            sshpass -e scp -o StrictHostKeyChecking=no schedule.tar.gz ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }}:/tmp/schedule.tar.gz
          fi
          if [ -f "images.tar.gz" ]; then
            sshpass -e scp -o StrictHostKeyChecking=no images.tar.gz ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }}:/tmp/images.tar.gz
          fi

      - name: Extract Archives on VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} "
            # Create target directories if they don't exist
            mkdir -p /data/programaciontv/schedule
            mkdir -p /data/programaciontv/wp-content/uploads/downloaded-images
            
            # Extract and remove schedule archive
            if [ -f /tmp/schedule.tar.gz ]; then
              tar -xzf /tmp/schedule.tar.gz -C /data/programaciontv/schedule/
              rm /tmp/schedule.tar.gz
            fi
            
            # Extract and remove images archive
            if [ -f /tmp/images.tar.gz ]; then
              tar -xzf /tmp/images.tar.gz -C /data/programaciontv/wp-content/uploads/downloaded-images/
              rm /tmp/images.tar.gz
            fi
          "
